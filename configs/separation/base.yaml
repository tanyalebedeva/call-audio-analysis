base: ../paths.yaml
task: separation
data:
  speech_train: "{data_root}/manifests/speech_train.jsonl"
  speech_val: "{data_root}/manifests/speech_val.jsonl"
  speech_test: "{data_root}/manifests/speech_test.jsonl"
  noise_train: "{data_root}/manifests/noise_train.jsonl"
  noise_val: "{data_root}/manifests/noise_val.jsonl"
  noise_test: "{data_root}/manifests/noise_test.jsonl"
  segment_sec: 4.0
  snr_range: [-5, 15]
  epoch_size: 4000     # смесей за эпоху (генерируются заново каждую эпоху)
  val_size: 300
  telephone_prob: 0.0
epochs: 25
batch_size: 16
eval_batch_size: 16
lr: 1.0e-3
weight_decay: 1.0e-4
grad_clip: 5.0
